<div style="margin-top: 20px; padding: 20px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box;">

            <div style="margin: 20px 0; display: flex; align-items: center; gap: 20px; justify-content: space-between;">

            <div style="display: flex; gap: 20px; margin-top: 15px; background: #111; padding: 15px; border-radius: 4px; justify-content: space-between; border: 1px solid #222;">

                    <div style="font-size: 12px; color: #aaa;">实时吞吐量 (QPS)</div>

                <div style="flex: 1; text-align: center;">

                    <div style="font-size: 12px; color: #aaa; display: flex; justify-content: space-between; align-items: center;">

                    <div style="height: 110px; width: 100%; margin-top: 12px; position: relative;">
                        <canvas id="cpuChart"></canvas>
                    </div>
                </div>
                <div style="background: #111; border: 1px solid #333; padding: 15px; width: 31%; border-radius: 4px; box-sizing: border-box;">
                    <div style="font-size: 12px; color: #aaa; display: flex; justify-content: space-between; align-items: center;">
                        <span>🧠 内存剩余 (Avail)</span>
                        <span id="memDisplay" style="color: #33ccff; font-weight: bold;">0.0%</span>
                    </div>
                    <div style="height: 110px; width: 100%; margin-top: 12px; position: relative;">
                        <canvas id="memChart"></canvas>
                    </div>
                </div>
                <div style="background: #111; border: 1px solid #333; padding: 15px; width: 31%; border-radius: 4px; box-sizing: border-box;">
                    <div style="font-size: 12px; color: #aaa; display: flex; justify-content: space-between; align-items: center;">

                        <canvas id="ioChart"></canvas>

                </div>

                <h3 style="margin-top: 0; color: #00ff66; font-size: 16px; text-shadow: 0 0 5px rgba(0,255,102,0.3);">📈 全局实时 QPS 动力波形图</h3>
                <div style="position: relative; height: 240px; width: 100%;">
                    <canvas id="qpsChart"></canvas>
                </div>
            </div>

        <div class="form-panel">
